<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Creator Database</title>

  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

  <style>
    body { font-family: sans-serif; padding: 20px; }
    #tag-filters label { margin-right: 10px; }
    .link-btn {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 2px 6px;
      font-size: 0.85em;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h2>Creator Database</h2>

<div id="tag-filters"></div>
<br>

<table id="table" class="display" style="width:100%"></table>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
Papa.parse("actors.csv", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {

    // Remove rows without a Name
    const rows = results.data.filter(r => r.Name);

    // Extract tags safely
    rows.forEach(r => {
      r.__tags = (r.Tags || "")
        .split(";")
        .map(t => t.trim())
        .filter(Boolean);
    });

    // Build tag filter UI
    const allTags = [...new Set(rows.flatMap(r => r.__tags))].sort();
    $('#tag-filters').html(
      allTags.map(t =>
        `<label><input type="checkbox" value="${t}"> ${t}</label>`
      ).join(" ")
    );

    // Dynamically generate columns
    const headers = Object.keys(rows[0]).filter(h => !h.startsWith("__"));

    const columns = headers.map(h => {
      if (h === "Tags") {
        return {
          title: h,
          data: h,
          render: v => v || ""
        };
      }

      // Render URLs as buttons
      return {
        title: h,
        data: h,
        render: v => {
          if (typeof v === "string" && v.startsWith("http")) {
            return `<a class="link-btn" href="${v}" target="_blank">${h}</a>`;
          }
          return v || "";
        }
      };
    });

    const table = $('#table').DataTable({
      data: rows,
      columns: columns,
      order: [[0, "asc"]] // Name column
    });

    // Tag AND-filter
    $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
      const selected = $('#tag-filters input:checked')
        .map((_, el) => el.value)
        .get();

      if (!selected.length) return true;

      const rowTags = rows[dataIndex].__tags;
      return selected.every(t => rowTags.includes(t));
    });

    $('#tag-filters input').on('change', () => table.draw());
  }
});
</script>

</body>
</html>
