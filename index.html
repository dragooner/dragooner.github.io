<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC Database</title>

  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

  <style>
    :root {
      /* Dark theme (default) */
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-hover: #30363d;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --pill-bg: #30363d;
      --pill-text: #c9d1d9;
      --pill-hover: #484f58;
      --link-color: #58a6ff;
      --shadow: 0 3px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #f0f3f6;
      --bg-hover: #e8ebef;
      --border-color: #d0d7de;
      --text-primary: #1f2328;
      --text-secondary: #57606a;
      --text-muted: #8c959f;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --pill-bg: #e8ebef;
      --pill-text: #1f2328;
      --pill-hover: #d0d7de;
      --link-color: #0969da;
      --shadow: 0 3px 6px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .last-updated {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ---------- Theme Toggle ---------- */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .toggle-switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .toggle-switch:hover {
      border-color: var(--accent);
    }

    .toggle-switch.active::before {
      transform: translateX(24px);
      background: var(--accent);
    }

    .toggle-icons {
      display: flex;
      gap: 6px;
      font-size: 1.1rem;
    }

    /* ---------- Search Bar ---------- */
    .search-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .search-input-wrapper {
      position: relative;
      max-width: 500px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    #text-search {
      width: 100%;
      padding: 10px 12px 10px 38px;
      font-size: 0.9rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    #text-search::placeholder {
      color: var(--text-muted);
    }

    #text-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    /* ---------- Filter Bar ---------- */
    .filter-bar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tag-search-wrapper {
      position: relative;
      flex: 0 1 280px;
      min-width: 200px;
    }

    .tag-search-wrapper .search-icon {
      left: 12px;
    }

    #tag-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      font-size: 0.9rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      transition: all 0.2s ease;
    }

    #tag-input::placeholder {
      color: var(--text-muted);
    }

    #tag-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    #tag-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      z-index: 100;
      max-height: 280px;
      overflow-y: auto;
    }

    #tag-suggestions:empty {
      display: none;
    }

    .suggestion {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .suggestion:first-child {
      border-radius: 7px 7px 0 0;
    }

    .suggestion:last-child {
      border-radius: 0 0 7px 7px;
    }

    .suggestion:only-child {
      border-radius: 7px;
    }

    .suggestion:hover {
      background: var(--bg-hover);
    }

    /* ---------- Active Tags ---------- */
    .active-tags-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .active-tags-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #active-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #active-tags:empty::before {
      content: "No filters active";
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    .clear-all-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .clear-all-btn:hover {
      background: #d73a49;
      border-color: #d73a49;
      color: #fff;
    }

    /* ---------- Pills ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .pill:hover {
      background: var(--pill-hover);
      border-color: var(--border-color);
    }

    .pill.add:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pill.add::after {
      content: "+";
      font-size: 0.9em;
      opacity: 0;
      margin-left: -2px;
      transition: opacity 0.15s ease;
    }

    .pill.add:hover::after {
      opacity: 0.7;
    }

    .pill.remove {
      background: var(--accent);
      color: #fff;
    }

    .pill.remove:hover {
      background: #d73a49;
      border-color: #d73a49;
    }

    .pill.remove::after {
      content: "×";
      font-size: 1.1em;
      font-weight: 400;
      opacity: 0.7;
      margin-left: -2px;
    }

    .pill.remove:hover::after {
      opacity: 1;
    }

    /* ---------- Table Container ---------- */
    .table-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    /* ---------- Tags Column ---------- */
    th.tags-column,
    td.tags-column {
      min-width: 280px;
    }

    .tags-column {
      white-space: normal !important;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
    }

    /* ---------- Link Buttons ---------- */
    .link-btn {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--link-color);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .link-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    /* ---------- DataTables Overrides ---------- */
    .dataTables_wrapper {
      font-size: 0.9rem;
    }

    table.dataTable {
      border-collapse: collapse !important;
      margin-top: 12px !important;
    }

    table.dataTable thead th,
    table.dataTable thead td {
      border-bottom: 2px solid var(--border-color) !important;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 600;
      padding: 12px 14px !important;
    }

    table.dataTable tbody tr {
      background: var(--bg-secondary);
      transition: background 0.15s ease;
    }

    table.dataTable tbody tr:hover {
      background: var(--bg-tertiary) !important;
    }

    table.dataTable tbody td {
      padding: 12px 14px !important;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    table.dataTable.stripe tbody tr.odd,
    table.dataTable.display tbody tr.odd {
      background: var(--bg-secondary);
    }

    table.dataTable.stripe tbody tr.even,
    table.dataTable.display tbody tr.even {
      background: var(--bg-primary);
    }

    .dataTables_info,
    .dataTables_length,
    .dataTables_filter {
      color: var(--text-secondary) !important;
      margin-bottom: 12px;
    }

    .dataTables_length select,
    .dataTables_filter input {
      background: var(--bg-tertiary) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      color: var(--text-primary) !important;
      padding: 6px 10px !important;
      margin: 0 6px;
    }

    .dataTables_filter input:focus {
      outline: none;
      border-color: var(--accent) !important;
    }

    .dataTables_paginate {
      margin-top: 16px !important;
    }

    .dataTables_paginate .paginate_button {
      background: var(--bg-tertiary) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      color: var(--text-primary) !important;
      margin: 0 2px;
      padding: 6px 12px !important;
      transition: all 0.15s ease;
    }

    .dataTables_paginate .paginate_button:hover {
      background: var(--bg-hover) !important;
      border-color: var(--accent) !important;
      color: var(--accent) !important;
    }

    .dataTables_paginate .paginate_button.current {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }

    .dataTables_paginate .paginate_button.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dataTables_paginate .paginate_button.disabled:hover {
      background: var(--bg-tertiary) !important;
      border-color: var(--border-color) !important;
      color: var(--text-primary) !important;
    }

    /* Sort icons */
    table.dataTable thead .sorting::before,
    table.dataTable thead .sorting::after,
    table.dataTable thead .sorting_asc::before,
    table.dataTable thead .sorting_asc::after,
    table.dataTable thead .sorting_desc::before,
    table.dataTable thead .sorting_desc::after {
      opacity: 0.5;
    }

    table.dataTable thead .sorting_asc::before,
    table.dataTable thead .sorting_desc::after {
      opacity: 1;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .header h1 {
        font-size: 1.4rem;
      }

      .search-bar {
        padding: 14px;
      }

      .search-input-wrapper {
        max-width: 100%;
      }

      .filter-bar {
        padding: 14px;
      }

      .filter-row {
        flex-direction: column;
        align-items: stretch;
      }

      .tag-search-wrapper {
        flex: 1;
        width: 100%;
      }

      .active-tags-wrapper {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .table-container {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">
    <h1>SC Database</h1>
    <span class="last-updated" id="last-updated"></span>
    <span class="last-updated">This page is NOT associate with SimpCity and is entirely made and maintained by a fan</span>
  </div>
  <div class="theme-toggle">
    <span class="toggle-icons">
      <span class="icon-dark">&#x1F319;</span>
    </span>
    <div class="toggle-switch" id="theme-toggle" role="button" aria-label="Toggle theme"></div>
    <span class="toggle-icons">
      <span class="icon-light">&#9728;</span>
    </span>
  </div>
</header>

<div class="search-bar">
  <div class="search-input-wrapper">
    <span class="search-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04Z"/>
      </svg>
    </span>
    <input id="text-search" type="text" placeholder="Search text..." autocomplete="off" />
  </div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <div class="tag-search-wrapper">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/>
        </svg>
      </span>
      <input id="tag-input" type="text" placeholder="Search tags..." autocomplete="off" />
      <div id="tag-suggestions"></div>
    </div>
    <div class="active-tags-wrapper">
      <span class="active-tags-label">Active Filters:</span>
      <div id="active-tags"></div>
      <button id="clear-all" class="clear-all-btn" style="display: none;">Clear All</button>
    </div>
  </div>
</div>

<div class="table-container">
  <table id="table" class="display" style="width:100%"></table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// Theme toggle
const themeToggle = document.getElementById('theme-toggle');
const html = document.documentElement;

function setTheme(theme) {
  html.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeToggle.classList.toggle('active', theme === 'light');
}

// Initialize theme from localStorage or default to dark
const savedTheme = localStorage.getItem('theme') || 'dark';
setTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  setTheme(current === 'dark' ? 'light' : 'dark');
});

// Fetch last updated date from GitHub
function formatDate(dateStr) {
  const date = new Date(dateStr);
  const day = date.getDate();
  const month = date.toLocaleString('en-US', { month: 'long' });
  const year = date.getFullYear();

  // Add ordinal suffix
  const suffix = (day === 1 || day === 21 || day === 31) ? 'st' :
                 (day === 2 || day === 22) ? 'nd' :
                 (day === 3 || day === 23) ? 'rd' : 'th';

  return `${month} ${day}${suffix}, ${year}`;
}

fetch('https://api.github.com/repos/dragooner/dragooner.github.io/commits?path=actors.csv&per_page=1')
  .then(res => res.json())
  .then(commits => {
    if (commits && commits[0] && commits[0].commit) {
      const date = commits[0].commit.committer.date;
      document.getElementById('last-updated').textContent = `Last updated ${formatDate(date)}`;
    }
  })
  .catch(() => {
    // Silently fail - don't show anything if we can't fetch
  });

// Data handling
const activeTags = new Set();
let allTags = [];
let rows = [];
let table = null;

Papa.parse("actors.csv", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {

    // Keep only valid rows
    rows = results.data.filter(r => r.Name);

    // Parse tags defensively and sort alphabetically
    rows.forEach(r => {
      r.__tags = (r.Tags || "")
        .split(";")
        .map(t => t.trim())
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    });

    allTags = [...new Set(rows.flatMap(r => r.__tags))].sort();

    // Build columns dynamically (ignore internal fields)
    const headers = Object.keys(rows[0]).filter(h => !h.startsWith("__"));

    const columns = headers.map(h => {
      if (h === "Tags") {
        return {
          title: h,
          data: h,
          render: (_, __, row) =>
          `<div class="tags-container">
            ${row.__tags.map(t =>
              `<span class="pill add" data-tag="${t}">${t}</span>`
            ).join("")}
          </div>`
        };
      }

      return {
        title: h,
        data: h,
        render: v => {
          if (typeof v === "string" && v.startsWith("http")) {
            return `<a class="link-btn" href="${v}" target="_blank">${h}</a>`;
          }
          return v || "";
        }
      };
    });

    table = $('#table').DataTable({
      data: rows,
      columns: columns,
      autoWidth: false,
      order: [[0, "asc"]],
      columnDefs: [
        {
          targets: headers.indexOf("Tags"),
          className: "tags-column",
          width: "280px"
        }
      ],
      language: {
        search: "",
        searchPlaceholder: "Search all columns...",
        lengthMenu: "Show _MENU_ entries",
        info: "Showing _START_ to _END_ of _TOTAL_ creators",
        infoEmpty: "No creators found",
        infoFiltered: "(filtered from _MAX_ total)"
      }
    });

    // AND-based tag filter
    $.fn.dataTable.ext.search.push((settings, data, dataIndex) => {
      if (!activeTags.size) return true;
      return [...activeTags].every(t => rows[dataIndex].__tags.includes(t));
    });

    // Row tag add (+)
    $('#table').on('click', '.pill.add', function() {
      const tag = this.dataset.tag;
      if (!activeTags.has(tag)) {
        activeTags.add(tag);
        renderActiveTags();
        table.draw();
      }
    });

    setupTagSearch();
    setupTextSearch();

    // Hide DataTables default search (we use our own)
    $('.dataTables_filter').hide();

    // Clear all button
    $('#clear-all').on('click', clearAllTags);
  }
});

function renderActiveTags() {
  $('#active-tags').html(
    [...activeTags].map(t =>
      `<span class="pill remove" data-tag="${t}">${t}</span>`
    ).join("")
  );

  // Show/hide clear all button
  $('#clear-all').toggle(activeTags.size > 0);

  $('#active-tags .pill').on('click', function() {
    activeTags.delete(this.dataset.tag);
    renderActiveTags();
    table.draw();
  });
}

function clearAllTags() {
  activeTags.clear();
  renderActiveTags();
  table.draw();
}

function setupTagSearch() {
  $('#tag-input').on('input', function() {
    const q = this.value.toLowerCase();
    if (!q) {
      $('#tag-suggestions').empty();
      return;
    }

    const matches = allTags.filter(t =>
      t.toLowerCase().includes(q) && !activeTags.has(t)
    );

    $('#tag-suggestions').html(
      matches.slice(0, 10).map(t =>
        `<div class="suggestion" data-tag="${t}">${t}</div>`
      ).join("")
    );
  });

  $('#tag-input').on('keydown', function(e) {
    if (e.key === 'Enter') {
      const firstSuggestion = $('#tag-suggestions .suggestion').first();
      if (firstSuggestion.length) {
        firstSuggestion.click();
      }
    } else if (e.key === 'Escape') {
      $('#tag-suggestions').empty();
      this.blur();
    }
  });

  $('#tag-suggestions').on('click', '.suggestion', function() {
    activeTags.add(this.dataset.tag);
    $('#tag-input').val("");
    $('#tag-suggestions').empty();
    renderActiveTags();
    table.draw();
  });

  // Click outside closes suggestions
  document.addEventListener("click", e => {
    if (!e.target.closest(".tag-search-wrapper")) {
      $('#tag-suggestions').empty();
    }
  });
}

function setupTextSearch() {
  $('#text-search').on('input', function() {
    table.search(this.value).draw();
  });

  $('#text-search').on('keydown', function(e) {
    if (e.key === 'Escape') {
      this.value = '';
      table.search('').draw();
      this.blur();
    }
  });
}
</script>

</body>
</html>
